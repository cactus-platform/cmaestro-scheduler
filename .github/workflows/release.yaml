name: CMEASTRO SCHEDULER | Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  
env:
  BIN_NAME: cmaestro-scheduler
  BIN_FOLDER: bin
  PACKAGE_PATH: cmaestro-scheduler/cmd/scheduler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmaestro-scheduler/go.mod
          cache: true

      - name: Build
        run: go build -v -o $BIN_FOLDER/$BIN_NAME $PACKAGE_PATH

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Semantic Release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/github \
            @semantic-release/git

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
